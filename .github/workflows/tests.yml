name: Prove dell'app

# 1.0.11 (H-04): a ogni modifica di sorgenti, strumenti o prove: build, controllo che i file generati siano quelli
# salvati, controllo dei testi nelle 14 lingue e prove nuove (tests/t110). Non pubblica niente.
on:
  push:
    paths: ["src/**", "tools/**", "tests/**", "app-android/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["src/**", "tools/**", "tests/**", "app-android/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

concurrency:
  group: tanetto-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Android toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK platform e build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Dipendenze e sincronizzazione Capacitor
        working-directory: app-android
        run: |
          npm ci --no-audit --no-fund
          cd ..
          python3 tools/build.py
          python3 app-android/prep_www.py
          cd app-android
          npx cap sync android
      - name: Compilazione Java Android
        working-directory: app-android/android
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Test unitari policy età Android
        working-directory: app-android/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.tanettoapp.tanetto.AgePolicyTest
      - name: Strumenti
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Build (e sincronizzazione degli artefatti)
        run: |
          python3 tools/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html elimina-account.html licenses.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Build generated Tanetto web assets"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              if [ "$attempt" -eq 3 ]; then echo "Push artefatti non riuscito dopo 3 tentativi"; exit 1; fi
            done
          fi
          git diff --stat --exit-code
      - name: Testi nelle 14 lingue
        run: set -o pipefail; node tools/check_lang.js | tail -3
      - name: Regole Firestore (emulatore)
        timeout-minutes: 10
        run: |
          npm install --prefix /tmp/tanetto-fbemu --no-audit --no-fund firebase-tools@13.35.1
          npm install --prefix /tmp/tanetto-fbmodules --no-audit --no-fund firebase@13.0.0
          FBEMU=/tmp/tanetto-fbemu FB_NODE_MODULES=/tmp/tanetto-fbmodules/node_modules bash tests/t110/run_n111_rules.sh
      - name: Prove 1.0.11
        run: |
          fail=0
          for t in tests/t110/t_*.py; do
            echo "=== $t"
            rc=0
            (cd tests/t110 && timeout 1500 python3 -u $(basename $t)) > /tmp/tanetto-test.log 2>&1 || rc=$?
            grep -E "^NO |TUTTO OK|CI SONO|Traceback" /tmp/tanetto-test.log | head -20
            if [ "$rc" -ne 0 ] || ! grep -q "TUTTO OK" /tmp/tanetto-test.log; then echo "TEST FALLITO: $t (exit $rc)"; fail=1; fi
          done
          exit $fail
