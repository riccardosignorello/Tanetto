<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Tanetto: scaricala gratis</title>
<meta name="description" content="Tanetto, l’app gratuita per prenderti cura di te con un piccolo cucciolo. Su Android, iPhone e PC.">
<meta property="og:title" content="Tanetto: scaricala gratis">
<meta property="og:description" content="Piccoli obiettivi ogni giorno rendono felice il tuo cucciolo. Gratis, in 14 lingue.">
<meta property="og:image" content="https://tanetto.app/og.png">
<meta name="theme-color" content="#F6EFE4">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon-32.png">
<link rel="canonical" href="https://tanetto.app/">
<style>
:root{--bg:#F6EFE4;--ink:#3A3128;--muted:#7A6E62;--accent:#3E7A3A}
@media (prefers-color-scheme:dark){:root{--bg:#1E1B17;--ink:#F3EBDD;--muted:#B9AD9C;--accent:#79B873}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{padding:24px 16px;max-width:420px}
img{width:88px;height:88px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
h1{font-size:1.5rem;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 20px}
a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px}
a.sub{display:block;margin-top:14px;color:var(--accent)}
</style>
</head>
<body>
<main>
<img src="../icon-192.png" alt="Icona di Tanetto" width="88" height="88">
<h1>Tanetto</h1>
<p id="t">Gratis su Android, iPhone e PC, in 14 lingue.</p>
<a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.tanettoapp.tanetto">Scaricala da Google Play</a>
<a class="sub" id="web" href="../app/">Su iPhone o PC? Usala dal browser</a>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var clean = function (v, d) { return (v || d).replace(/[^a-z0-9_.-]/gi, "").slice(0, 40) || d; };
  var src = clean(q.get("utm_source") || q.get("src"), "test");
  var med = clean(q.get("utm_medium"), q.get("utm_source") ? "web" : "social");
  var camp = clean(q.get("utm_campaign"), q.get("utm_source") ? "tanetto_app" : "bio");
  var play = "https://play.google.com/store/apps/details?id=com.tanettoapp.tanetto&referrer=" +
    encodeURIComponent("utm_source=" + src + "&utm_medium=" + med + "&utm_campaign=" + camp);
  var web = "../app/?src=" + encodeURIComponent(src);
  document.getElementById("play").href = play;
  document.getElementById("web").href = web;
  var lang = (navigator.language || "").toLowerCase();
  if (lang.indexOf("it") !== 0) {
    document.documentElement.lang = "en";
    document.title = "Tanetto: get it free";
    document.querySelector("img").alt = "Tanetto icon";
    document.getElementById("t").textContent = "Free on Android, iPhone and PC, in 14 languages.";
    document.getElementById("play").textContent = "Get it on Google Play";
    document.getElementById("web").textContent = "On iPhone or PC? Use it in your browser";
  }
  var ua = navigator.userAgent || "";
  if (/Android/i.test(ua)) location.replace(play);
  else if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) location.replace(web);
})();
</script>
</body>
</html>
